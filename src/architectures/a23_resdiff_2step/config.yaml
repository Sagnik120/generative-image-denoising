# Config for a23_resdiff_2step. Round 4 (strictly generative); see docs/PLAN.md.
architecture: a23_resdiff_2step

model:
  width: 16
  enc_blocks: [2, 2, 2, 4]       # NAFBlocks per encoder level, 256px -> 32px
  middle_blocks: 3               # at 16px
  dec_blocks: [1, 1, 1, 2]
  time_dim: 64
  diffusion_levels: 4
  steps: 2                       # K, sampling passes per call (all counted in FLOPs)
  kappa: 0.1
  eta_power: 2.0

data:
  patch_size: 256
  batch_size: 16
  val_batch_size: 16
  num_workers: 8
  steps_per_epoch: 2500          # an "epoch" is this many steps; validation runs after each
  degradation:                   # the "v2" pipeline (src/common/degradations.py), as a15/a19
    families: v2
    num_ops_probs: [0.08, 0.34, 0.36, 0.17, 0.05]
    shuffle_prob: 0.5
    severity_beta: [1.0, 1.8]
    listed_weight: 0.65

train:
  epochs: 24                     # x 2500 steps = 60,000 steps
  lr: 0.0004
  lr_min: 0.000001
  warmup_steps: 1000
  weight_decay: 0.0001
  amp: true
  ema_decay: 0.999
  grad_clip: 1.0
  wavelet_weight: 0.0
  self_pred_prob: 0.5
  last_level_prob: 0.5
  loss:                          # composite loss on the clean-image output
    charbonnier: 1.0
    fft: 0.05
    ssim: 0.2
    dists: 0.1
    dists_start_frac: 0.5
    dists_batch: 4
  visualize_every: 4
  checkpoint_every: 1
  log_every: 250
  seed: 42
