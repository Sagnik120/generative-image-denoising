# Config for the Pix2Pix-style conditional GAN architecture.
architecture: pix2pix_gan

model:
  width: 32
  enc_blocks: [2, 2, 4, 8]
  middle_blocks: 4
  dec_blocks: [2, 2, 2, 2]
  predict_residual: true
  disc_base_ch: 64
  disc_layers: 3

data:
  patch_size: 256
  batch_size: 16
  num_workers: 4
  val_fraction: 0.03
  download_bsds: true
  min_degrade_ops: 1
  max_degrade_ops: 3

train:
  epochs: 60
  lr_g: 0.0002
  lr_d: 0.0002
  loss: l1                      # reconstruction loss combined with adversarial loss
  lambda_recon: 100.0           # weight of reconstruction loss vs adversarial loss
  visualize_every: 2
  checkpoint_every: 1
  seed: 42
